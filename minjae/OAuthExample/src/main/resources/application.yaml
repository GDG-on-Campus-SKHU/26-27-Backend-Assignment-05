spring:
  application:
    name: OAuthExample

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:create}
    show-sql: true
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${ACCESS_EXP}
  refresh-token-expiration: ${REFRESH_EXP}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}
